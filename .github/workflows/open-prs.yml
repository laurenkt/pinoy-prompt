# Every pull request is meant to be merged by the thread that opened it once CI
# is green. One that conflicts with main never gets CI and wakes nobody, and a
# thread can miss the event that says CI passed, so a PR can sit open unnoticed.
# After every push to main (when a PR is most likely to start conflicting), and
# hourly, this finds each open PR that conflicts with main or has been open two
# hours or more (a missed CI signal, or CI left red). It comments on the PR,
# once per commit and reason, which wakes the thread watching it and notifies
# the PR's author. Draft PRs are left out.
name: Open PRs

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  pull-requests: write

concurrency:
  group: open-prs

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Flag stuck pull requests
        run: |
          list() { gh pr list --state open --base main --limit 500 --json number,title,url,isDraft,mergeable,createdAt,headRefOid,statusCheckRollup --jq 'map(select(.isDraft | not))'; }
          # GitHub works out mergeability on request, and a push to main resets it, so give it a moment.
          if [ "${{ github.event_name }}" = push ]; then sleep 20; fi
          for try in 1 2 3; do
            prs=$(list)
            echo "$prs" | jq -e 'any(.mergeable == "UNKNOWN")' > /dev/null || break
            if [ "$try" -lt 3 ]; then sleep 15; fi
          done
          stuck=$(echo "$prs" | jq -c '
            map(.hours = ((now - (.createdAt | fromdateiso8601)) / 3600 | floor)
              | .failing = any(.statusCheckRollup[]?; .conclusion == "FAILURE" or .conclusion == "TIMED_OUT" or .state == "FAILURE" or .state == "ERROR")
              | .reason = (if .mergeable == "CONFLICTING" then "conflict" elif .hours < 2 then null
                           elif .failing then "failing" else "open" end)
              | select(.reason))')

          # Tell each PR's own thread, once per commit and reason.
          echo "$stuck" | jq -c '.[]' | while read -r pr; do
            number=$(echo "$pr" | jq .number)
            marker="<!-- open-prs:$(echo "$pr" | jq -r '.headRefOid + ":" + .reason') -->"
            bodies=$(gh pr view "$number" --json comments --jq '.comments[].body') || continue
            if grep -qF "$marker" <<< "$bodies"; then continue; fi
            reason=$(echo "$pr" | jq -r .reason)
            if [ "$reason" = conflict ]; then
              message='This pull request conflicts with `main`, so CI has not run on it and it cannot be merged. Merge `main` into the branch, run the tests and build, push, wait for CI, then merge and check it shows as merged.'
            elif [ "$reason" = failing ]; then
              message="This pull request has been open $(echo "$pr" | jq .hours) hours and CI is failing on its latest commit. Find the cause and fix it (a flaky test included, rather than re-running until it passes), push, wait for CI, then merge and check it shows as merged."
            else
              message="This pull request has been open $(echo "$pr" | jq .hours) hours without being merged. If CI is green and its review is addressed, merge it and check it shows as merged. If it was superseded, close it."
            fi
            gh pr comment "$number" --body "$(printf '%s\n\n%s' "$message" "$marker")" \
              || echo "::warning::Couldn't comment on #$number"
          done

