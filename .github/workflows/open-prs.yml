# Every pull request is meant to be merged by the thread that opened it once CI
# is green. One that conflicts with main never gets CI and wakes nobody, so it
# can sit open unnoticed. Each hour this lists any open PR that conflicts with
# main or has been open over three hours in one issue, "Pull requests left
# open", comments when a PR joins the list, and closes the issue once there are
# none. Draft PRs are left out.
name: Open PRs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: open-prs

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Pull requests left open
    steps:
      - name: List stuck pull requests
        run: |
          list() { gh pr list --state open --base main --limit 500 --json number,title,url,isDraft,mergeable,createdAt --jq 'map(select(.isDraft | not))'; }
          prs=$(list)
          # GitHub works out mergeability on request, so ask again once it has had a moment.
          if echo "$prs" | jq -e 'any(.mergeable == "UNKNOWN")' > /dev/null; then sleep 20; prs=$(list); fi
          stuck=$(echo "$prs" | jq -c '
            map(.hours = ((now - (.createdAt | fromdateiso8601)) / 3600 | floor)
              | select(.mergeable == "CONFLICTING" or .hours >= 3))')
          lines=$(echo "$stuck" | jq -r 'map("- [#\(.number)](\(.url)) \(.title): "
            + (if .mergeable == "CONFLICTING" then "conflicts with main, so CI hasn'"'"'t run"
               elif .mergeable == "UNKNOWN" then "open \(.hours) hours, and GitHub hasn'"'"'t said yet whether it conflicts"
               else "open \(.hours) hours" end)) | join("\n")')
          issue=$(gh issue list --state open --limit 500 --json number,title,body \
            --jq "map(select(.title == \"$TITLE\")) | .[0] // empty")
          if [ -n "$lines" ]; then
            echo "$lines"
            body=$(printf '%s\n\n%s\n\n%s' \
              'These pull requests have not been merged. Each one needs main merged in, tests run, CI green and a merge, or closing if it was superseded. This issue is updated every hour and closes itself once none are left.' \
              "$lines" \
              '_Checked by `.github/workflows/open-prs.yml`._')
            if [ -z "$issue" ]; then
              gh issue create --title "$TITLE" --body "$body"
            else
              number=$(echo "$issue" | jq .number)
              # Editing the body notifies nobody, so name any PR that has joined the list in a comment.
              added=$(echo "$stuck" | jq -r --argjson issue "$issue" \
                'map(select(.url as $u | $issue.body | contains("](\($u))") | not) | "#\(.number)") | join(", ")')
              gh issue edit "$number" --body "$body"
              if [ -n "$added" ]; then gh issue comment "$number" --body "Now also left open: $added."; fi
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$(echo "$issue" | jq .number)" --comment 'Every pull request is merged or closed now.'
          fi
