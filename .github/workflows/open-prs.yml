# Every pull request is meant to be merged by the thread that opened it once CI
# is green. One that conflicts with main never gets CI and wakes nobody, and a
# thread can miss the event that says CI passed, so a PR can sit open unnoticed.
# After every push to main (when a PR is most likely to start conflicting), and
# hourly, this finds each open PR that conflicts with main or has been open two
# hours or more. It comments on the PR, once per commit and reason, which wakes the thread
# watching it, and lists them all in one issue, "Pull requests left open",
# which closes itself once there are none. Draft PRs are left out.
name: Open PRs

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: open-prs

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Pull requests left open
    steps:
      - name: Flag stuck pull requests
        run: |
          list() { gh pr list --state open --base main --limit 500 --json number,title,url,isDraft,mergeable,createdAt,headRefOid --jq 'map(select(.isDraft | not))'; }
          # GitHub works out mergeability on request, and a push to main resets it, so give it a moment.
          if [ "${{ github.event_name }}" = push ]; then sleep 20; fi
          for try in 1 2 3; do
            prs=$(list)
            echo "$prs" | jq -e 'any(.mergeable == "UNKNOWN")' > /dev/null || break
            if [ "$try" -lt 3 ]; then sleep 15; fi
          done
          stuck=$(echo "$prs" | jq -c '
            map(.hours = ((now - (.createdAt | fromdateiso8601)) / 3600 | floor)
              | .reason = (if .mergeable == "CONFLICTING" then "conflict" elif .hours >= 2 then "open" else null end)
              | select(.reason))')

          # Tell each PR's own thread, once per commit and reason.
          echo "$stuck" | jq -c '.[]' | while read -r pr; do
            number=$(echo "$pr" | jq .number)
            marker="<!-- open-prs:$(echo "$pr" | jq -r '.headRefOid + ":" + .reason') -->"
            bodies=$(gh pr view "$number" --json comments --jq '.comments[].body') || continue
            if grep -qF "$marker" <<< "$bodies"; then continue; fi
            if [ "$(echo "$pr" | jq -r .reason)" = conflict ]; then
              message='This pull request conflicts with `main`, so CI has not run on it and it cannot be merged. Merge `main` into the branch, run the tests and build, push, wait for CI, then merge and check it shows as merged.'
            else
              message="This pull request has been open $(echo "$pr" | jq .hours) hours without being merged. If CI is green and its review is addressed, merge it and check it shows as merged. If it was superseded, close it."
            fi
            gh pr comment "$number" --body "$(printf '%s\n\n%s' "$message" "$marker")" \
              || echo "::warning::Couldn't comment on #$number"
          done

          lines=$(echo "$stuck" | jq -r 'map("- [#\(.number)](\(.url)) \(.title): "
            + (if .reason == "conflict" then "conflicts with main, so CI hasn'"'"'t run"
               elif .mergeable == "UNKNOWN" then "open \(.hours) hours, and GitHub hasn'"'"'t said yet whether it conflicts"
               else "open \(.hours) hours" end)) | join("\n")')
          issue=$(gh issue list --state open --limit 500 --json number,title,body \
            --jq "map(select(.title == \"$TITLE\")) | .[0] // empty")
          if [ -n "$lines" ]; then
            echo "$lines"
            body=$(printf '%s\n\n%s\n\n%s' \
              'These pull requests have not been merged. Each one needs main merged in, tests run, CI green and a merge, or closing if it was superseded. This issue is updated after every push to main and closes itself once none are left.' \
              "$lines" \
              '_Checked by `.github/workflows/open-prs.yml`._')
            if [ -z "$issue" ]; then
              gh issue create --title "$TITLE" --body "$body"
            else
              number=$(echo "$issue" | jq .number)
              # Editing the body notifies nobody, so name any PR that has joined the list in a comment.
              added=$(echo "$stuck" | jq -r --argjson issue "$issue" \
                'map(select(.url as $u | $issue.body | contains("](\($u))") | not) | "#\(.number)") | join(", ")')
              gh issue edit "$number" --body "$body"
              if [ -n "$added" ]; then gh issue comment "$number" --body "Now also left open: $added."; fi
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$(echo "$issue" | jq .number)" --comment 'Every pull request is merged or closed now.'
          fi
